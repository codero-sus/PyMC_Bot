name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# checks: write lets the failure steps publish the log tail as a check summary.
permissions:
  contents: read
  checks: write

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.4"
      - run: ruff check .

  javascript:
    name: javascript syntax + deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check the bridge, the panel JS and the test fixture
        run: |
          node --check pymc_bot/node/minecraft_bridge.js
          node --check pymc_bot/node/probe.js
          node --check pymc_bot/web/app.js
          node --check tests/fixtures/fake_bridge.js
          node scripts/check_ui.mjs
      - name: Verify package.json resolves (mineflayer + pathfinder)
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Bridge joins a server that is newer than mineflayer, and spots sleeping Aternos-style servers
        run: |
          node scripts/check_version_fallback.mjs
          PYMC_ADVERTISE=26.3:777 node scripts/check_version_fallback.mjs
          PYMC_EXPECT=asleep node scripts/check_version_fallback.mjs
          node pymc_bot/node/probe.js 127.0.0.1 1 3000 | grep -q '"ok":false'

  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # the bridge protocol tests need node
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Run the test suite
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest.log
      - name: Publish test failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_diagnostics.py pytest.log --title "pytest failed (python ${{ matrix.python-version }})"
      - name: CLI smoke test
        run: |
          python -m pymc_bot --version
          python -m pymc_bot doctor
          python -m pymc_bot run --backend simulated --no-ai --seconds 3 --quiet --config /tmp/ci.json
      - name: Train a player model on synthetic playtime, then run it
        run: |
          python -m pymc_bot train --simulate 3 --simulate-out /tmp/ci-playtime.jsonl --models-dir /tmp/ci-models --run-name ci --steps 60 --checkpoint-every 30 --quiet
          python -m pymc_bot models --models-dir /tmp/ci-models
          python -m pymc_bot run --backend simulated --think trained --models-dir /tmp/ci-models --run-name ci --no-ai --seconds 1 --quiet --config /tmp/ci-train.json

  updater:
    name: updater (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      GITHUB_TOKEN: ${{ github.token }}   # raises the API rate limit for the live checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (offline, with none of the bot's packages installed)
        shell: bash
        run: |
          set -o pipefail
          pip install pytest
          python -m pytest tests/test_updater.py -q --noconftest -rfE 2>&1 | tee updater-tests.log
      - name: Publish test failure diagnostics
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_diagnostics.py updater-tests.log --title "updater tests failed (${{ matrix.os }})"
      - name: Windows wrapper (updater.cmd)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call updater.cmd --help || exit /b 1
          call updater.cmd --mod-only --check --mc 26.3 --mods-dir "%RUNNER_TEMP%\mods-check" || exit /b 1
      - name: Shell wrapper (updater.sh)
        if: runner.os != 'Windows'
        run: |
          ./updater.sh --help
          ./updater.sh --mod-only --check --mc 26.3 --mods-dir "$RUNNER_TEMP/mods-check"
      - name: Live mod install from the newest release
        shell: bash
        run: |
          mods="$RUNNER_TEMP/mods"
          python updater.py --mod-only --mc 1.21.4 --mods-dir "$mods"
          ls -l "$mods"
          test -f "$mods"/pymc*+1.21.4.jar
          python updater.py --mod-only --mods-dir "$mods" | tee again.log
          grep -q "is up to date" again.log
      - name: Live update of a downloaded (non-git) copy
        shell: bash
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/updater-live.log") 2>&1
          set -x
          copy="$RUNNER_TEMP/zipcopy"
          mkdir -p "$copy"
          git archive --format=zip -o "$RUNNER_TEMP/source.zip" HEAD
          python -m zipfile -e "$RUNNER_TEMP/source.zip" "$copy"   # tar mangles D:\ paths on Windows
          echo '{"host": "keep-me"}' > "$copy/pymc_bot_config.json"
          echo "local edit" >> "$copy/README.md"
          cd "$copy"
          python updater.py --no-deps --branch "${{ github.head_ref || github.ref_name }}"
          grep -q keep-me pymc_bot_config.json
          ls .pymc_backup/*/README.md
          python updater.py --check --branch "${{ github.head_ref || github.ref_name }}" | grep -q "up to date"
      - name: Publish live update diagnostics
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_diagnostics.py updater-live.log --title "updater live check failed (${{ matrix.os }})"

  training-transformer:
    name: training (transformer engine, torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (CPU torch)
        run: |
          pip install -r requirements-dev.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Transformer engine tests
        run: |
          set -o pipefail
          pytest tests/test_train.py tests/test_local_model.py -q 2>&1 | tee pytest.log
      - name: Publish test failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_diagnostics.py pytest.log --title "transformer engine tests failed"

  mod-versions:
    name: mod (version list)
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - name: Read mod/versions.json
        id: list
        run: |
          list=$(jq -c '[.versions[].minecraft]' mod/versions.json)
          echo "Building the recorder for: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  mod:
    name: mod (fabric ${{ matrix.mc }})
    needs: mod-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ${{ fromJson(needs.mod-versions.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          # Loom 1.18 resolves only on a Java 25 runtime. The bytecode level follows the
          # game (Java 21 for 1.21.x, Java 25 for 26.x) - see mod/versions.json.
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the Fabric mod for Minecraft ${{ matrix.mc }}
        id: build
        working-directory: mod
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew build -Pmc=${{ matrix.mc }} --no-daemon --stacktrace 2>&1 | tee gradle.log
      - name: Check the jar targets the right game version
        working-directory: mod
        run: |
          jar=$(ls build/libs/pymcbot-*+${{ matrix.mc }}.jar)
          echo "built $jar"
          unzip -p "$jar" fabric.mod.json > fabric.mod.json.out
          cat fabric.mod.json.out
          grep -q '"minecraft": "${{ matrix.mc }}"' fabric.mod.json.out
          grep -q '"id": "pymcbot"' fabric.mod.json.out
          grep -q '"name": "PyMC Bot"' fabric.mod.json.out
          grep -q '"modmenu"' fabric.mod.json.out
          unzip -l "$jar" > jar-contents.txt
          for cls in compat/Mc RecorderHud PymcBotScreen PymcModMenu; do
            grep -q "dev/pymc/pymcb/client/$cls.class" jar-contents.txt || { echo "::error::$cls missing from $jar"; exit 1; }
          done
          grep -q "assets/pymcbot/lang/en_us.json" jar-contents.txt
          # The Mod Menu API stubs are compile-only; the real Mod Menu provides them.
          if grep -q "com/terraformersmc" jar-contents.txt; then
            echo "::error::$jar ships the Mod Menu API stubs"; exit 1
          fi
          # Release jars never carry the in-game test (that is the separate -PgameTest jar).
          if grep -qi gametest jar-contents.txt || grep -q "fabric-client-gametest" fabric.mod.json.out; then
            echo "::error::$jar contains game test code"; exit 1
          fi
      - name: Extract the gradle errors
        if: failure() && steps.ingame.outcome != 'failure'
        run: |
          grep -n -E "error:|What went wrong|Could not |Caused by|Execution failed|^> |FAILURE" mod/gradle.log | head -200 > mod/errors.txt
          wc -l mod/errors.txt
      - name: Probe the Minecraft API signatures
        if: failure() && steps.ingame.outcome != 'failure'
        run: python3 scripts/mc_api_probe.py | tee mod/api-probe.log
      - name: Publish mod build diagnostics
        if: failure() && steps.ingame.outcome != 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/ci_diagnostics.py mod/errors.txt --title "mc ${{ matrix.mc }}: Gradle errors (extracted)" --limit 12000
          python scripts/ci_diagnostics.py mod/api-probe.log --title "mc ${{ matrix.mc }}: Minecraft API probe" --limit 24000
          python scripts/ci_diagnostics.py mod/gradle.log --title "mc ${{ matrix.mc }}: Gradle log tail" --limit 12000
      - uses: actions/upload-artifact@v4
        with:
          name: pymcbot-${{ matrix.mc }}
          path: mod/build/libs/pymcbot-*+${{ matrix.mc }}.jar
          if-no-files-found: error

      # ---- in-game test: launch the real game with the mod (1.21.4+, "gametest" in versions.json)
      - name: Is there an in-game test for ${{ matrix.mc }}?
        id: gt
        run: |
          enabled=$(jq -r --arg mc "${{ matrix.mc }}" '.versions[] | select(.minecraft == $mc) | .gametest' mod/versions.json)
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "in-game test for ${{ matrix.mc }}: $enabled"
      - name: Start a virtual display with software OpenGL
        if: steps.gt.outputs.enabled == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libgl1-mesa-dri libglx-mesa0 libegl1 mesa-utils mesa-vulkan-drivers
          # 24-bit colour: Minecraft 26.3+ opens its window through SDL3, which finds no GLX visual
          # on xvfb-run's default 8-bit screen. With DISPLAY set, the Gradle task uses this display.
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 2
          DISPLAY=:99 glxinfo -B | grep -E "OpenGL (renderer|version)|direct rendering" || true
      - name: Download the game assets (retried - Mojang's CDN occasionally drops a file)
        if: steps.gt.outputs.enabled == 'true'
        working-directory: mod
        run: |
          for attempt in 1 2 3; do
            ./gradlew downloadAssets -Pmc=${{ matrix.mc }} -PgameTest --no-daemon -q && exit 0
            echo "::warning::asset download attempt $attempt failed, retrying in 20 s"
            sleep 20
          done
          exit 1
      - name: Launch Minecraft ${{ matrix.mc }} and run the in-game test
        id: ingame
        if: steps.gt.outputs.enabled == 'true'
        working-directory: mod
        timeout-minutes: 15
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          # -PgameTest builds a separate pymcbot-gametest jar with the test entrypoint;
          # the release jar uploaded above is untouched.
          # The game runs on its own Java (21 for 1.21.x, preinstalled on the runner; 25 for 26.x).
          ./gradlew runProductionClientGameTest -Pmc=${{ matrix.mc }} -PgameTest --no-daemon --stacktrace \
            -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64 2>&1 | tee gametest.log
      - name: In-game test report
        if: always() && steps.gt.outputs.enabled == 'true'
        run: |
          cat mod/build/run/gametest/pymc-gametest.txt 2>/dev/null || echo "(no report - the game did not reach the test)"
          ls -la mod/build/run/gametest/screenshots 2>/dev/null || true
      - name: Publish in-game test diagnostics
        if: failure() && steps.ingame.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -n -E "pymc gametest|AssertionError|Exception|Caused by|ERROR|FATAL|What went wrong|xvfb|GLFW|SDL|OpenGL" mod/gametest.log mod/build/run/gametest/logs/latest.log 2>/dev/null | head -250 > mod/gametest-errors.txt || true
          python scripts/ci_diagnostics.py mod/gametest-errors.txt --title "mc ${{ matrix.mc }}: in-game test errors (extracted)" --limit 16000
          python scripts/ci_diagnostics.py mod/gametest.log --title "mc ${{ matrix.mc }}: in-game test log tail" --limit 16000
      - uses: actions/upload-artifact@v4
        if: always() && steps.gt.outputs.enabled == 'true'
        with:
          name: gametest-${{ matrix.mc }}
          path: |
            mod/build/run/gametest/screenshots/
            mod/build/run/gametest/pymc-gametest.txt
            mod/build/run/gametest/pymc-playtime/meta.json
            mod/build/run/gametest/logs/latest.log
            mod/gametest.log
          if-no-files-found: warn

  mod-bundle:
    name: mod (all versions bundle)
    needs: mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pymcbot-*
          merge-multiple: true
          path: dist
      - name: List the jars
        run: ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: pymcbot-all-versions
          path: dist/*.jar
          if-no-files-found: error

  # Publishes every jar on a GitHub release (no login needed to download). Runs only after every
  # version built and every in-game test passed. Pushes to main make the stable release
  # pymcbot-v<mod_version>; other branches make/refresh it as a pre-release but never
  # replace a stable one. Bump mod_version in mod/gradle.properties for a new release.
  release:
    name: mod (GitHub release)
    needs: mod-bundle
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pymcbot-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pymcbot-all-versions
          path: dist
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(python3 scripts/release_notes.py --tag)
          python3 scripts/release_notes.py -o notes.md
          count=$(ls dist/*.jar | wc -l)
          expected=$(jq '.versions | length' mod/versions.json)
          echo "$count jar(s) for $expected version(s)"
          test "$count" -eq "$expected"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then pre=""; else pre="--prerelease"; fi
          if gh release view "$tag" > /dev/null 2>&1; then
            if [ "$(gh release view "$tag" --json isPrerelease --jq .isPrerelease)" = "false" ] && [ -n "$pre" ]; then
              echo "$tag is already a stable release - branch builds do not replace it"
              exit 0
            fi
            gh release delete "$tag" --cleanup-tag --yes
          fi
          gh release create "$tag" dist/*.jar --target "$GITHUB_SHA" \
            --title "PyMC Bot mod ${tag#pymcbot-v}" --notes-file notes.md $pre
          echo "### Released $tag" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
