name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# checks: write lets the failure steps publish the log tail as a check summary.
permissions:
  contents: read
  checks: write

jobs:
  python-distribution:
    name: Python distribution safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build && python -m twine check dist/* && python scripts/check_distribution.py dist
      - name: Test installed wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/pymc-wheel"
          "$RUNNER_TEMP/pymc-wheel/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pymc-wheel/bin/pymc-bot" --help
          "$RUNNER_TEMP/pymc-wheel/bin/python" -m pymc_bot bench --suite sim-tech

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.4"
      - run: ruff check .

  javascript:
    name: javascript syntax + deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check the bridge, the panel JS and the test fixture
        run: |
          node --check pymc_bot/node/minecraft_bridge.js
          node --check pymc_bot/node/probe.js
          node --check pymc_bot/node/potions.js
          node --check pymc_bot/node/safety.js
          node --check pymc_bot/web/app.js
          node scripts/check_ui.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mineflayer WITHOUT npm (python installer, sha512-checked, same tree as npm)
        run: python3 pymc_bot/node_setup.py --method python --node skip
      - name: The npm-free install loads in node, and a portable Node.js can be fetched when node is missing
        run: |
          node -e "require('mineflayer'); require('mineflayer-pathfinder'); console.log('mineflayer loads without npm')"
          PYMC_BOT_RUNTIME="$RUNNER_TEMP/rt" python3 pymc_bot/node_setup.py --target "$RUNNER_TEMP/rt" --node download
          PYMC_BOT_RUNTIME="$RUNNER_TEMP/rt" python3 pymc_bot/node_setup.py --check
      - name: Verify package.json also resolves with npm (the classic way keeps working)
        run: |
          mkdir -p "$RUNNER_TEMP/npm" && cp package.json "$RUNNER_TEMP/npm/"
          cd "$RUNNER_TEMP/npm" && npm install --no-audit --no-fund --ignore-scripts
      - name: Bridge joins a server that is newer than mineflayer, and spots sleeping Aternos-style servers
        run: |
          node scripts/check_version_fallback.mjs
          PYMC_ADVERTISE=26.3:777 node scripts/check_version_fallback.mjs
          PYMC_EXPECT=asleep node scripts/check_version_fallback.mjs
          node pymc_bot/node/probe.js 127.0.0.1 1 3000 > probe.out || true; grep -q '"ok":false' probe.out

  test:
    name: smoke checks (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: CLI smoke test
        run: |
          python -m pymc_bot --version
          python -m pymc_bot doctor
          python -m pymc_bot run --backend simulated --no-ai --seconds 3 --quiet --config /tmp/ci.json
      - name: Live web lookups the AI uses (Minecraft Wiki, DuckDuckGo)
        if: matrix.python-version == '3.12'
        continue-on-error: true   # third-party sites; never block a build on them
        run: |
          python -m pymc_bot search creeper --no-cache --no-fallback --no-mob-db --config /tmp/ci-search.json
          python -m pymc_bot search how to tame a wolf --no-cache --no-fallback --no-mob-db --config /tmp/ci-search.json
          python -m pymc_bot search what drops blaze rods --no-cache --no-fallback --no-mob-db --config /tmp/ci-search.json
          python -m pymc_bot search piglin behavior --no-cache --no-fallback --no-mob-db --config /tmp/ci-search.json
          python -m pymc_bot search creeper --provider duckduckgo --no-cache --no-fallback --no-mob-db --config /tmp/ci-search.json
      - name: Minecraft LLM - build the dataset offline, dry-run the Kaggle trainer for every size
        run: |
          python -m pymc_bot llm build --no-wiki --turns 300 --out /tmp/ci-llm --config /tmp/ci-llm.json
          for preset in qwen3-4b qwen3-8b qwen3-14b llama-3.2-3b qwen3.5-4b; do
            python /tmp/ci-llm/train_minecraft_llm.py --dry-run --data /tmp/ci-llm --preset "$preset"
          done
          python -m pymc_bot llm presets
      - name: Minecraft LLM - live Minecraft Wiki pages into the dataset
        if: matrix.python-version == '3.12'
        continue-on-error: true   # third-party site; never block a build on it
        run: |
          python -m pymc_bot llm build --wiki-pages 25 --turns 50 --out /tmp/ci-llm-wiki --config /tmp/ci-llm.json
          python -c "import json; card = json.load(open('/tmp/ci-llm-wiki/dataset_card.json')); print(card['sources']); assert card['sources'].get('wiki', 0) > 0, 'no wiki rows'"
      - name: Train a player model on synthetic playtime, then run it
        run: |
          python -m pymc_bot train --simulate 3 --simulate-out /tmp/ci-playtime.jsonl --models-dir /tmp/ci-models --run-name ci --steps 60 --checkpoint-every 30 --quiet
          python -m pymc_bot models --models-dir /tmp/ci-models
          python -m pymc_bot run --backend simulated --think trained --models-dir /tmp/ci-models --run-name ci --no-ai --seconds 1 --quiet --config /tmp/ci-train.json

  updater:
    name: updater (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      GITHUB_TOKEN: ${{ github.token }}   # raises the API rate limit for the live checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Windows wrapper (updater.cmd)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call updater.cmd --help || exit /b 1
          call updater.cmd --mod-only --check --mc 26.3 --mods-dir "%RUNNER_TEMP%\mods-check" || exit /b 1
      - name: Shell wrapper (updater.sh)
        if: runner.os != 'Windows'
        run: |
          ./updater.sh --help
          ./updater.sh --mod-only --check --mc 26.3 --mods-dir "$RUNNER_TEMP/mods-check"
      - name: Live mod install from the newest release
        shell: bash
        run: |
          mods="$RUNNER_TEMP/mods"
          python updater.py --mod-only --mc 1.21.4 --mods-dir "$mods"
          ls -l "$mods"
          test -f "$mods"/pymc*+1.21.4.jar
          python updater.py --mod-only --mods-dir "$mods" | tee again.log
          grep -q "is up to date" again.log

  mod-versions:
    name: mod (version list)
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - name: Read mod/versions.json
        id: list
        run: |
          list=$(jq -c '[.versions[].minecraft]' mod/versions.json)
          echo "Building the recorder for: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  mod:
    name: mod (fabric ${{ matrix.mc }})
    needs: mod-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ${{ fromJson(needs.mod-versions.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          # Loom 1.18 resolves only on a Java 25 runtime. The bytecode level follows the
          # game (Java 21 for 1.21.x, Java 25 for 26.x) - see mod/versions.json.
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the Fabric mod for Minecraft ${{ matrix.mc }}
        id: build
        working-directory: mod
        run: |
          set -o pipefail
          chmod +x gradlew
          # Maven Central / maven.fabricmc.net occasionally fail to serve a file ("Could not find
          # gson ..."). Retry such network hiccups twice so one blip does not cancel the release and
          # the Modrinth upload; real compile errors still fail on the first try. Maven Central also
          # rate-limits busy runners (HTTP 429): wait longer then, and don't refresh (more requests).
          extra=""
          for attempt in 1 2 3; do
            if ./gradlew build -Pmc=${{ matrix.mc }} --no-daemon --stacktrace $extra 2>&1 | tee gradle.log; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ] && grep -qE "Could not (find|resolve|GET|HEAD|download)|Connection (reset|refused|timed out)|Read timed out|Received status code (429|5[0-9][0-9])|Too Many Requests|Remote host terminated|DownloadException|Failed download" gradle.log \
                && ! grep -qE "Compilation failed|\.java:[0-9]+: error" gradle.log; then
              if grep -qE "status code 429|Too Many Requests" gradle.log; then
                wait=$((90 * attempt)); extra=""
              else
                wait=30; extra="--refresh-dependencies"
              fi
              echo "::warning::dependency download failed - retrying in $wait s (attempt $attempt of 3)"
              sleep "$wait"
              continue
            fi
            exit 1
          done
      - name: Check the jar targets the right game version
        working-directory: mod
        run: |
          jar=$(ls build/libs/pymcbot-*+${{ matrix.mc }}.jar)
          echo "built $jar"
          unzip -p "$jar" fabric.mod.json > fabric.mod.json.out
          cat fabric.mod.json.out
          grep -q '"minecraft": "${{ matrix.mc }}"' fabric.mod.json.out
          grep -q '"id": "pymcbot"' fabric.mod.json.out
          grep -q '"name": "PyMC Bot"' fabric.mod.json.out
          grep -q '"modmenu"' fabric.mod.json.out
          unzip -l "$jar" > jar-contents.txt
          for cls in compat/Mc RecorderHud PymcBotScreen PymcModMenu; do
            grep -q "dev/pymc/pymcb/client/$cls.class" jar-contents.txt || { echo "::error::$cls missing from $jar"; exit 1; }
          done
          grep -q "assets/pymcbot/lang/en_us.json" jar-contents.txt
          # The Mod Menu API stubs are compile-only; the real Mod Menu provides them.
          if grep -q "com/terraformersmc" jar-contents.txt; then
            echo "::error::$jar ships the Mod Menu API stubs"; exit 1
          fi
          # Release jars must not carry in-game test code.
          if grep -qi gametest jar-contents.txt || grep -q "fabric-client-gametest" fabric.mod.json.out; then
            echo "::error::$jar contains game test code"; exit 1
          fi
      - name: Extract the gradle errors
        if: failure()
        run: |
          grep -n -E "error:|What went wrong|Could not |Caused by|Execution failed|^> |FAILURE" mod/gradle.log | head -200 > mod/errors.txt
          wc -l mod/errors.txt
      - name: Probe the Minecraft API signatures
        if: failure()
        run: python3 scripts/mc_api_probe.py | tee mod/api-probe.log
      - name: Publish mod build diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/ci_diagnostics.py mod/errors.txt --title "mc ${{ matrix.mc }}: Gradle errors (extracted)" --limit 12000
          python scripts/ci_diagnostics.py mod/api-probe.log --title "mc ${{ matrix.mc }}: Minecraft API probe" --limit 24000
          python scripts/ci_diagnostics.py mod/gradle.log --title "mc ${{ matrix.mc }}: Gradle log tail" --limit 12000
      - uses: actions/upload-artifact@v4
        with:
          name: pymcbot-${{ matrix.mc }}
          path: mod/build/libs/pymcbot-*+${{ matrix.mc }}.jar
          if-no-files-found: error


  mod-bundle:
    name: mod (all versions bundle)
    needs: mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pymcbot-*
          merge-multiple: true
          path: dist
      - name: List the jars
        run: ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: pymcbot-all-versions
          path: dist/*.jar
          if-no-files-found: error

  # Everything except the jars for the release: the updater, the bot (source zip + pip packages) and
  # the Minecraft LLM kit (training data with Minecraft Wiki pages + the trainer; the notebook is linked, not attached). Runs next
  # to the mod builds, so it adds no time.
  release-kit:
    name: release kit (updater, bot, LLM kit)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt build
      - name: Build the kit
        run: python scripts/release_kit.py --out release-kit --work "$RUNNER_TEMP/kit-work"
      - uses: actions/upload-artifact@v4
        with:
          name: release-kit
          path: release-kit/*
          if-no-files-found: error

  # Publishes every jar on a GitHub release (no login needed to download). Runs only after every
  # required builds and checks pass. Pushes to main make the stable release
  # pymcbot-v<mod_version>; other branches make/refresh it as a pre-release but never
  # replace a stable one. Bump mod_version in mod/gradle.properties for a new release.
  release:
    name: mod (GitHub release)
    needs: [mod-bundle, release-kit, lint, javascript, test]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[no-release]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pymcbot-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pymcbot-all-versions
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-kit
          path: dist
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(python3 scripts/release_notes.py --tag)
          python3 scripts/release_notes.py -o notes.md
          count=$(ls dist/*.jar | wc -l)
          expected=$(jq '.versions | length' mod/versions.json)
          echo "$count jar(s) for $expected version(s)"
          test "$count" -eq "$expected"
          (cd dist && zip -q "pymcbot-${tag#pymcbot-v}-all-versions.zip" pymcbot-*.jar)
          python3 scripts/release_kit.py --checksums dist
          ls -la dist
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then pre=""; else pre="--prerelease"; fi
          if gh release view "$tag" > /dev/null 2>&1; then
            if [ "$(gh release view "$tag" --json isPrerelease --jq .isPrerelease)" = "false" ] && [ -n "$pre" ]; then
              echo "$tag is already a stable release - branch builds do not replace it"
              exit 0
            fi
            gh release delete "$tag" --cleanup-tag --yes
          fi
          gh release create "$tag" dist/* --target "$GITHUB_SHA" \
            --title "PyMC Bot ${tag#pymcbot-v}" --notes-file notes.md $pre
          echo "### Released $tag" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"

  # Syncs Modrinth after the builds and checks on pushes to main or explicitly requested branches: the project's
  # title, summary, description (mod/MODRINTH.md), links and licence (mod/modrinth.json), and every
  # version - missing ones are created, existing ones get fresh details, and their jar is replaced when
  # the code changed. Needs the repository secret MODRINTH_TOKEN and the variable MODRINTH_PROJECT
  # (see mod/README.md -> Publishing on Modrinth). Other branches publish only on request: put
  # [modrinth] in the commit message.
  modrinth:
    name: mod (Modrinth)
    needs: [mod-bundle, lint, javascript, test]
    # main always publishes; any other branch only when the pushed commit message contains [modrinth].
    if: >-
      github.event_name == 'push' && vars.MODRINTH_PROJECT != '' &&
      (github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[modrinth]'))
    runs-on: ubuntu-latest
    concurrency:
      group: pymcbot-modrinth
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: pymcbot-all-versions
          path: mod/dist
      - name: Sync the Modrinth project and all versions
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT: ${{ vars.MODRINTH_PROJECT }}
        run: |
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "::warning::MODRINTH_TOKEN secret is not set - showing what would be published"
            python3 scripts/modrinth_publish.py --jars mod/dist --update-project --dry-run
            exit 0
          fi
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then channel=release; else channel=beta; fi
          args="--jars mod/dist --channel $channel --update-project"
          set +e
          python3 scripts/modrinth_publish.py $args 2>&1 | tee modrinth.txt
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "### Modrinth"
            echo '```'
            cat modrinth.txt
            echo '```'
            echo "https://modrinth.com/mod/$MODRINTH_PROJECT"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            grep -E '^!|failed' modrinth.txt | while read -r line; do echo "::error::$line"; done
            exit "$status"
          fi

  # Updates only the description on the Modrinth page (mod/MODRINTH.md) - no build, no versions, no jars.
  # Runs for any branch when the pushed commit message contains [modrinth-doc].
  modrinth-doc:
    name: Modrinth description
    if: github.event_name == 'push' && vars.MODRINTH_PROJECT != '' && contains(github.event.head_commit.message, '[modrinth-doc]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update the Modrinth summary and description
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT: ${{ vars.MODRINTH_PROJECT }}
        run: |
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "::warning::MODRINTH_TOKEN secret is not set - showing what would be updated"
            python3 scripts/modrinth_publish.py --description-only --dry-run
            exit 0
          fi
          python3 scripts/modrinth_publish.py --description-only
