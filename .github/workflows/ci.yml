name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.4"
      - run: ruff check .

  javascript:
    name: javascript syntax + deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check the bridge, the panel JS and the test fixture
        run: |
          node --check pymc_bot/node/minecraft_bridge.js
          node --check pymc_bot/web/app.js
          node --check tests/fixtures/fake_bridge.js
          node scripts/check_ui.mjs
      - name: Verify package.json resolves (mineflayer + pathfinder)
        run: npm install --no-audit --no-fund --ignore-scripts

  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"   # the bridge protocol tests need node
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Run the test suite
        run: pytest -q
      - name: CLI smoke test
        run: |
          python -m pymc_bot --version
          python -m pymc_bot doctor
          python -m pymc_bot run --backend simulated --no-ai --seconds 3 --quiet --config /tmp/ci.json
