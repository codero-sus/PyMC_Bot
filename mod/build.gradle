import groovy.json.JsonSlurper

// PyMC Bot mod - one source tree, one jar per Minecraft version.
//
//   ./gradlew build                 -> the default version from versions.json (newest)
//   ./gradlew build -Pmc=1.21.4     -> build/libs/pymcbot-<mod_version>+1.21.4.jar
//   ./gradlew printTargets          -> every supported version
//   ./gradlew runProductionClientGameTest -Pmc=1.21.4 -PgameTest
//                                   -> launches the real game and runs the in-game test (1.21.4+)
//
// 1.21.x is obfuscated, so it is built with the remapping Loom plugin and Mojang's
// mappings; 26.1 and newer ship unobfuscated and use the plain Loom plugin (no
// mappings, no remapJar, implementation instead of modImplementation). Both plugin ids
// come from the same Loom release, so only one of them is applied per build.
plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'maven-publish'
}

def table = new JsonSlurper().parse(file('versions.json'))
def supported = table.versions.collect { it.minecraft as String }
def requested = providers.gradleProperty('mc').getOrElse(table.default as String)
def target = table.versions.find { it.minecraft == requested }
if (target == null) {
	throw new GradleException("Unknown Minecraft version '${requested}'. Supported: ${supported.join(', ')}")
}
def mcVersion = target.minecraft as String
def obfuscated = target.obfuscated as boolean
def javaLevel = target.java as int
def compatDir = "src/compat/${target.compat}/java"
def loaderVersion = table.loader as String
def fabricApiVersion = target.fabric_api as String

// -PgameTest adds the in-game test (src/gametest/java) and its fabric-client-gametest entrypoint to
// a separately named jar, so release jars never contain test code. Fabric's client game test API
// exists from Minecraft 1.21.4 on ("gametest": true in versions.json).
def gameTest = providers.gradleProperty('gameTest').isPresent()
if (gameTest && !(target.gametest as boolean)) {
	def testable = table.versions.findAll { it.gametest }.collect { it.minecraft }
	throw new GradleException("Minecraft ${mcVersion} has no client game test API. In-game tests run on: ${testable.join(', ')}")
}

apply plugin: obfuscated ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'

version = "${project.mod_version}+${mcVersion}"
group = project.maven_group
base {
	archivesName = gameTest ? 'pymcbot-gametest' : 'pymcbot'
}

repositories {
	// Loom adds the essential maven repositories to download Minecraft and libraries from.
	// Add extra repositories here only when depending on other mods.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"pymcbot" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// The handful of calls that differ between Minecraft versions live in one small class,
// dev.pymc.pymcb.client.compat.Mc, with one copy per API era under src/compat/.
sourceSets.client.java.srcDir compatDir
if (gameTest) {
	sourceSets.client.java.srcDir 'src/gametest/java'
}

dependencies {
	minecraft "com.mojang:minecraft:${mcVersion}"
	if (obfuscated) {
		mappings loom.officialMojangMappings()
		modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
		// Fabric API is required: /pymc is registered through fabric-command-api-v2, the
		// hotkey through the key binding/mapping API and auto-record through networking.
		modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
	} else {
		implementation "net.fabricmc:fabric-loader:${loaderVersion}"
		implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
	}
}

processResources {
	def expansions = [
		version  : project.version.toString(),
		minecraft: mcVersion,
		java     : javaLevel.toString(),
		loader   : loaderVersion,
		gametest_entrypoint: gameTest
				? ',\n\t\t"fabric-client-gametest": [\n\t\t\t"dev.pymc.pymcb.gametest.PymcClientGameTest"\n\t\t]'
				: '',
	]
	inputs.properties expansions

	filesMatching("fabric.mod.json") {
		expand expansions
	}
}

tasks.withType(JavaCompile).configureEach {
	// Loom 1.18 needs a Java 25 Gradle JVM; the bytecode level follows the game:
	// Java 21 for 1.21.x, Java 25 for 26.x.
	it.options.release = javaLevel
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present. If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(javaLevel)
	targetCompatibility = JavaVersion.toVersion(javaLevel)
}

// src/client/java/com/terraformersmc/modmenu/api holds two compile-only copies of Mod Menu's
// public interfaces, so the "Configure" button works without a Mod Menu dependency per Minecraft
// version. They are never shipped: the real Mod Menu provides them at runtime.
def modMenuStubs = 'com/terraformersmc/**'

tasks.named('sourcesJar') {
	exclude modMenuStubs
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName
	exclude modMenuStubs

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

if (gameTest) {
	dependencies {
		// The game test runs the built jar in a real (production) Fabric launch next to Fabric API.
		productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
	}

	// Launches Minecraft with the mod and runs PymcClientGameTest: it creates a singleplayer world,
	// records a few seconds of scripted play, takes screenshots and checks the exported dataset.
	// On Linux CI the game runs in a virtual display (apt install xvfb). Results end up in
	// build/run/gametest/ (screenshots/, pymc-playtime/, pymc-gametest.txt, logs/).
	def gameTestJava = providers.gradleProperty('gameTestJava').map { it as int }.getOrElse(javaLevel)
	tasks.register('runProductionClientGameTest', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
		group = 'verification'
		description = "Runs the PyMC Bot in-game test on Minecraft ${mcVersion}."
		jvmArgs.add('-Dfabric.client.gametest')
		// Fabric's network synchronizer is known to be flaky on GitHub Actions runners.
		jvmArgs.add('-Dfabric.client.gametest.disableNetworkSynchronizer=true')
		runDir = layout.buildDirectory.dir('run/gametest')
		// Use the existing display when there is one (a desktop, or the 24-bit Xvfb that CI starts -
		// SDL3 in 26.3+ needs 24-bit colour). Without one, Loom wraps the game in xvfb-run on CI.
		useXVFB = providers.environmentVariable('DISPLAY').map { false }
				.orElse(providers.environmentVariable('CI').map { true }.orElse(false))
		// Run the game on the Java it ships with (21 for 1.21.x, 25 for 26.x); override with -PgameTestJava=25.
		javaLauncher = javaToolchains.launcherFor {
			languageVersion = JavaLanguageVersion.of(gameTestJava)
		}
	}
}

tasks.register('printTargets') {
	group = 'help'
	description = 'Lists every Minecraft version this mod can be built for.'
	def lines = table.versions.collect {
		String.format('%-8s fabric-api %-18s java %-2s %-27s%s', it.minecraft, it.fabric_api, it.java,
				it.obfuscated ? 'remapped (Mojang mappings)' : 'unobfuscated', it.gametest ? 'in-game test' : 'compile only')
	}
	def current = mcVersion
	doLast {
		println "Building for: ${current}   (change with -Pmc=<version>)"
		lines.each { println "  ${it}" }
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
		// Add repositories to publish to here.
	}
}
