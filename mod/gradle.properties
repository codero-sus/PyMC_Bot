# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Toolchain - the same for every target: the official fabric-example-mod branches for
# 1.21.1 through 26.3 all pin Loom 1.18-SNAPSHOT, Gradle 9.7.1 and Fabric Loader 0.19.5.
# Loom 1.18 only runs on a Java 25 Gradle JVM.
loom_version=1.18-SNAPSHOT

# Mod Properties
mod_version=0.9.0
maven_group=dev.pymc

# Minecraft / Fabric API pins live in versions.json (one entry per supported version).
# Pick one with -Pmc=<version>, e.g. ./gradlew build -Pmc=1.21.4
